name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # The gamepad test reads the engine's input transport from its private
      # source repository; the secret is a token with read access to it.
      - run: npm test
        env:
          MIGO_ENGINE_TOKEN: ${{ secrets.MIGO_ENGINE_READ_TOKEN }}
